[project]
name = "image-view-worker"
version = "0.1.0"
description = "Bounded offline image view renderer for forensic inspection"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow==11.3.0"]

[project.scripts]
image-view-worker = "image_view_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_view_worker"]
