[project]
name = "trustmark-worker"
version = "0.1.0"
description = "Offline Adobe TrustMark P/Q decoder worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Pillow==11.3.0",
  "torch==2.6.0+cpu",
  "torchvision==0.21.0+cpu",
  "trustmark==0.9.1",
]

[project.scripts]
trustmark-worker = "trustmark_worker.__main__:main"
trustmark-provision-models = "trustmark_worker.provision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustmark_worker"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
