[project]
name = "meta-watermarks-worker"
version = "0.1.0"
description = "Offline Meta VideoSeal and Watermark Anything decoder worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av==14.0.1",
  "einops==0.8.1",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
  "timm==0.9.16",
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
]

[project.scripts]
meta-watermarks-worker = "meta_watermarks_worker.__main__:main"
meta-watermarks-provision = "meta_watermarks_worker.provision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_watermarks_worker"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
