[project]
name = "watermark-classic-worker"
version = "0.1.0"
description = "Local classical invisible-watermark decoder worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "onnxruntime==1.22.1",
  "opencv-python-headless==4.10.0.84",
  "PyWavelets==1.6.0",
]

[project.scripts]
watermark-classic-worker = "watermark_classic_worker.__main__:main"
watermark-classic-provision = "watermark_classic_worker.provision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watermark_classic_worker"]
