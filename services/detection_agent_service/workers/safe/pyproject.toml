[project]
name = "safe-detector-worker"
version = "0.1.0"
description = "Resident local SAFE synthetic-image detector worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "kornia==0.7.2",
  "Pillow==11.3.0",
  "pytorch-wavelets==1.3.0",
  "PyWavelets==1.8.0",
  "setuptools==80.9.0",
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
]

[project.scripts]
safe-worker = "safe_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_worker"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
