[project]
name = "mirror-detector-worker"
version = "0.1.0"
description = "Resident experimental MIRROR DINOv3-H+ inference worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "peft==0.17.1",
  "Pillow==11.3.0",
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
  "transformers==4.56.2",
]

[project.scripts]
mirror-worker = "mirror_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_worker"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
